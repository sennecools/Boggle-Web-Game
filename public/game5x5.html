<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Boggle</title>
</head>

<body>
    <h1>Boggle Game</h1>
    <div id="timer">Time 3:00</div>
    <div id="multiplayer"></div>
    <div id="bigboard">
        <div class="column"></div>
        <div id="board" class="grid5x5">
            <div class="cell">
                <button data-square="1" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="2" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="3" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="4" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="5" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="6" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="7" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="8" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="9" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="10" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="11" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="12" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="13" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="14" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="15" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="16" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="17" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="18" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="19" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="20" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="21" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="22" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="23" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="24" class="letterButton" type="button">A</button>
            </div>
            <div class="cell">
                <button data-square="25" class="letterButton" type="button">A</button>
            </div>
        </div>
        <div id="woorden">Wordlist | Points</div>
    </div>
    <div class="buttons">
        <button type="button" disabled id="addWord">Add word</button>
        <button type="button" id="undo">Undo</button>
    </div>
    <div id="word"></div>
    <div id="resultaat"></div>
    <div class="buttonmode">
        <button type="button" id="mode3x3">3x3</button>
        <button type="button" id="mode4x4">4x4</button>
    </div>
    <script src="js/scripts5x5"></script>
</body>

</html>
